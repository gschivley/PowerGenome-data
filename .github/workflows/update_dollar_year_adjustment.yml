name: Update dollar year adjustment (GDP-IPD)

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Fetch GDP-IPD data
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python fetch_gdp_ipd_data.py --verbose

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dollar_year_adjustment.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update dollar_year_adjustment.csv (GDP-IPD)"
            git push
          fi
